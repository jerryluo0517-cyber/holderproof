<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1220" viewBox="0 0 1600 1220" role="img" aria-labelledby="title desc">
<title id="title">HolderProof: full-fact certification and two independent gates</title>
<desc id="desc">Three committee members independently replay query, balance and checkpoint. Two matching approvals certify one shared fact. Airdrop and Governance gates reuse it with independent thresholds. Local EVM archival checks provide independent correctness evidence.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#334155"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#183153}.heading{font-weight:700;font-size:34px}.sub{font-size:19px;fill:#52657b}.stage{font-size:16px;font-weight:700;letter-spacing:2px;fill:#0f766e}.box-title{font-size:23px;font-weight:700}.body{font-size:18px;fill:#334155}.small{font-size:16px;fill:#52657b}.edge{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}.thin{fill:none;stroke:#94a3b8;stroke-width:2}</style></defs>
<rect width="1600" height="1220" fill="#f8fafc"/>
<rect width="1600" height="10" fill="#0f766e"/>
<text x="64" y="67" class="heading">HolderProof | Certified history, reusable policy</text>
<text x="64" y="103" class="sub">Local fixture P0 · 2-of-3 business committee · Independent Airdrop and Governance Lyquids · 2026-11-15</text>

<text x="64" y="145" class="stage">01  SELECT A HISTORICAL QUERY</text>
<rect x="64" y="165" width="420" height="113" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="86" y="200" class="box-title">User / CLI</text>
<text x="86" y="231" class="body">proof(token, holder, block)</text>
<text x="86" y="257" class="body">run-proof.sh prints the certificate</text>
<rect x="568" y="165" width="464" height="113" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="590" y="200" class="box-title">Indexer Lyquid</text>
<text x="590" y="231" class="body">Capture holder + block per round</text>
<text x="590" y="257" class="body">Coordinate report_balance()</text>
<rect x="1116" y="165" width="420" height="113" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="1138" y="200" class="box-title">Source and infrastructure</text>
<text x="1138" y="231" class="body">308 deterministic Transfer events</text>
<text x="1138" y="257" class="body">4 localnet nodes; only 3 committee voters</text>
<path d="M484 222 H562" class="edge"/>
<text x="64" y="315" class="stage">02  INDEPENDENT REPLAY + FULL-FACT AGREEMENT</text>
<rect x="64" y="350" width="464" height="130" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
<text x="86" y="385" class="box-title">Committee member 1</text>
<text x="86" y="416" class="body">Local fixture replay + Merkle checkpoint</text>
<text x="86" y="442" class="body">BalanceFact = query + balance + checkpoint</text>
<text x="86" y="468" class="body">Per-node proposal cache</text>
<rect x="568" y="350" width="464" height="130" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
<text x="590" y="385" class="box-title">Committee member 2</text>
<text x="590" y="416" class="body">Local fixture replay + Merkle checkpoint</text>
<text x="590" y="442" class="body">BalanceFact = query + balance + checkpoint</text>
<text x="590" y="468" class="body">Per-node proposal cache</text>
<rect x="1072" y="350" width="464" height="130" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
<text x="1094" y="385" class="box-title">Committee member 3</text>
<text x="1094" y="416" class="body">Local fixture replay + Merkle checkpoint</text>
<text x="1094" y="442" class="body">BalanceFact = query + balance + checkpoint</text>
<text x="1094" y="468" class="body">Per-node proposal cache</text>
<path d="M800 278 V330 H296 M800 330 H1304" class="thin"/>
<path d="M296 330 V344" class="edge"/>
<path d="M800 330 V344" class="edge"/>
<path d="M1304 330 V344" class="edge"/>
<path d="M296 480 V517 H1304 V480" class="thin"/>
<path d="M800 480 V547" class="edge"/>
<rect x="536" y="553" width="528" height="112" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="558" y="588" class="box-title">Full-fact agreement</text>
<text x="558" y="619" class="body">At least 2 identical facts from distinct nodes</text>
<text x="558" y="645" class="body">Repeated node submissions do not count</text>
<rect x="64" y="553" width="420" height="145" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="86" y="588" class="box-title">Independent EVM cross-check</text>
<text x="86" y="619" class="body">Replay all 308 Transfer logs</text>
<text x="86" y="645" class="body">18 archival balanceOf comparisons</text>
<text x="86" y="671" class="body">Fixture N maps to EVM N+2</text>
<rect x="1116" y="553" width="420" height="145" rx="14" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
<text x="1138" y="588" class="box-title">Reject and preserve boundaries</text>
<text x="1138" y="619" class="body">No quorum: no certificate</text>
<text x="1138" y="645" class="body">Invalid / revoked proof: no eligibility</text>
<text x="1138" y="671" class="body">Shared bugs remain a trust assumption</text>
<path d="M800 665 V724" class="edge"/>
<text x="64" y="751" class="stage">03  CERTIFY ONCE</text>
<rect x="480" y="730" width="640" height="135" rx="14" fill="#ecfeff" stroke="#67e8f9" stroke-width="1.5"/>
<text x="502" y="765" class="box-title">Native certified write → shared QueryCertificate</text>
<text x="502" y="796" class="body">Entire fact JSON is inside the signed call payload</text>
<text x="502" y="822" class="body">Store native signatures, hashes and state provenance</text>
<text x="502" y="848" class="body">Identical query keeps the original certificate</text>
<text x="64" y="910" class="stage">04  INDEPENDENT GATES</text>
<path d="M800 865 V885 H414 V934" class="edge"/>
<path d="M800 885 H1186 V934" class="edge"/>
<rect x="64" y="940" width="700" height="130" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="86" y="975" class="box-title">AirdropGateLyquid</text>
<text x="86" y="1006" class="body">Alice balance 62685: threshold 60000 → true; 70000 → false</text>
<text x="86" y="1032" class="body">call! → shared validation → own threshold</text>
<text x="86" y="1058" class="body">claim(): one entitlement per holder; no token payout</text>
<rect x="836" y="940" width="700" height="130" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
<text x="858" y="975" class="box-title">GovernanceGateLyquid</text>
<text x="858" y="1006" class="body">Same certificate: threshold 50000 → true; 70000 → false</text>
<text x="858" y="1032" class="body">call! → shared validation → independent threshold</text>
<text x="858" y="1058" class="body">vote(): one record per proposal / holder</text>
<rect x="64" y="1111" width="1472" height="77" rx="12" fill="#e2e8f0"/>
<text x="86" y="1140" class="small">Trust anchor: configured Indexer + Lyquor native authentication. Exported signature JSON is not a detached proof service.</text>
<text x="86" y="1167" class="small">Canonical policy is network state; replay caches and bounded result history are instance state. Fixture hashes are synthetic.</text>
</svg>
