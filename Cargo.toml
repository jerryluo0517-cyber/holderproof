[workspace]
members = ["lyquid-indexer", "lyquid-consumer"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
lyquid = { version = "0.8.4", features = ["ldk"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
lyquid-test = "0.8.4"

[profile.release]
strip = "debuginfo"
debug = false
